[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stegodng"
version = "1.0.0"
description = "Embed binary payloads in the raw sensor data of DNG files mimicking Fujifilm GFX 100 Pixel Shift Combiner output"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AM", email = "alexmi3.14@gmail.com" }]
keywords = ["steganography", "dng", "tiff", "raw", "fujifilm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security :: Cryptography",
]
dependencies = ["numpy", "pillow", "tifffile[all]", "tqdm"]

[project.urls]
Homepage = "https://github.com/alexmi256/RawHide"
Repository = "https://github.com/alexmi256/RawHide"

[project.scripts]
stegodng = "stegodng.cli:main"
stego-dng = "stegodng.cli:main"

[tool.setuptools]
py-modules = ["stego_dng"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stegodng*"]

# Camera profile data (harvested per-camera metadata + docs) ships with
# the package so --camera-profile works from an install, not just a
# checkout.
[tool.setuptools.package-data]
"stegodng.profiles" = ["*/profile.json", "*/README.md", "PROFILES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
# Shipped code only (mirrors `just lint` scope): tests intentionally pass
# mistyped values to exercise error paths, so they stay out of the gate.
project-includes = ["stegodng/**/*.py", "stego_dng.py"]
# Oldest supported interpreter (matches requires-python and ruff target).
python-version = "3.10"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Error-level rules only (syntax/statement/runtime errors + pyflakes).
# Style rules (E501, isort, format) are intentionally off: the existing
# codebase predates linting and reformatting it is out of scope.
select = ["E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Thin backwards-compat shim: every import is a deliberate re-export
# (pinned by test_shim_delegates_to_package).
"stego_dng.py" = ["F401", "F811"]

[tool.coverage.run]
branch = false
source = ["stegodng", "stego_dng"]
# Subprocess CLI cases are also exercised in-process (tests call main()
# directly), so no omit is needed for cli.py. Only genuinely untestable
# code is excluded below.

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == ['\"]__main__['\"]:",
    # Real network fetch: hermetic tests use injected openers instead.
    "def _default_opener",
]
